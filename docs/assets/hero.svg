<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">MotionStudio — Direct the motion. Keep the evidence.</title><desc id="desc">Original conceptual artwork: luminous motion paths pass through three layers representing source, frames and evidence. This is not a product screenshot or a rendered film.</desc>
