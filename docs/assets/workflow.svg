<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="320" viewBox="0 0 1440 320" role="img" aria-labelledby="title desc"><title id="title">From intention to evidence</title><desc id="desc">Three stages: direct with brief and scene, render with Canvas and FFmpeg, then inspect with comparative profiles and human review. Inspect is in the development branch.</desc><rect width="1440" height="320" rx="20" fill="#0c1423"/><g font-family="Arial, Helvetica, sans-serif"><text x="55" y="57" font-size="13" letter-spacing="3" fill="#768eae">01</text><text x="55" y="120" fill="#e1e9f4" font-size="34" letter-spacing="2">DIRECT</text><text x="55" y="173" fill="#9eb3ce" font-size="23">Brief &#8594; Scene</text><text x="55" y="257" fill="#6f88aa" font-size="12" letter-spacing="1.8">INTENTION / RHYTHM / SOUND</text><path d="M430 150h44m-8-8 8 8-8 8" stroke="#567092" stroke-width="1.5" fill="none"/><path d="M493 49v220" stroke="#25354d"/><text x="525" y="57" font-size="13" letter-spacing="3" fill="#768eae">02</text><text x="525" y="120" fill="#e1e9f4" font-size="34" letter-spacing="2">RENDER</text><text x="525" y="173" fill="#9eb3ce" font-size="23">Canvas &#8594; FFmpeg</text><text x="525" y="257" fill="#6f88aa" font-size="12" letter-spacing="1.8">SOURCE / FRAMES / FILM</text><path d="M900 150h44m-8-8 8 8-8 8" stroke="#567092" stroke-width="1.5" fill="none"/><path d="M963 49v220" stroke="#25354d"/><text x="995" y="57" font-size="13" letter-spacing="3" fill="#768eae">03</text><text x="995" y="120" fill="#e1e9f4" font-size="34" letter-spacing="2">INSPECT</text><text x="995" y="173" fill="#9eb3ce" font-size="23">Compare &#8594; Review</text><text x="995" y="257" fill="#6f88aa" font-size="12" letter-spacing="1.8">PROFILE / EVIDENCE / HUMAN</text><rect x="1220" y="36" width="145" height="30" rx="15" fill="#1b2d46"/><text x="1240" y="56" font-size="11" fill="#a9bfdc" letter-spacing="1">DEV BRANCH</text></g></svg>